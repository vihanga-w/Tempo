<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tempo API Speed Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    canvas {
      max-width: 800px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Tempo API Request Speed</h1>
  <canvas id="speedChart"></canvas>

  <script>
    const ctx = document.getElementById('speedChart').getContext('2d');
    const speedData = {
      labels: [],
      datasets: [{
        label: 'Requests per Second (spotifyAPI.speed1)',
        data: [],
        fill: false,
        borderColor: 'blue',
        tension: 0, // Set tension to 0 for less smoothing
        pointRadius: 0 // Remove data point dots
      }]
    };

    const speedChart = new Chart(ctx, {
      type: 'line',
      data: speedData,
      options: {
        animation: false, // Disable animations
        plugins: {
          tooltip: {
            enabled: true, // Enable tooltips for interactivity
            callbacks: {
              label: function(context) {
                return `Speed: ${context.raw.toFixed(2)} req/sec`;
              }
            }
          },
          zoom: {
            pan: {
              enabled: true, // Enable panning
              mode: 'x'
            },
            zoom: {
              wheel: {
                enabled: true // Enable zooming with the mouse wheel
              },
              pinch: {
                enabled: true // Enable zooming with pinch gestures
              },
              mode: 'x'
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Time'
            },
            type: 'time', // Ensure time axis is configured correctly
            time: {
              unit: 'minute',
              tooltipFormat: 'HH:mm:ss',
              displayFormats: {
                minute: 'HH:mm'
              }
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Requests/sec'
            }
          }
        }
      }
    });

    let first = true;
    let lastTs = 0;
    let speedSum = 0;
    let speedCount = 0;
    let rollingWindow = [];
    const rollingWindowSize = 10;

    async function fetchSpeed() {
      try {
        const response = await fetch('/.stats');
        const data = await response.json();
        // const currentSpeed = data.spotifyAPI.speed1;

        const latestTs = data.spotifyAPI.history[data.spotifyAPI.history.length - 1].timestamp;

        if (!first && lastTs == latestTs) {
          const offset = Date.now() - data.spotifyAPI.lastPeriod;
          const currentSpeed = data.spotifyAPI.curr / (offset / 1e3);

          // Update chart with the latest in-memory value
          const now = new Date();
          speedChart.data.labels.push(now);

          // Update rolling average calculation
          rollingWindow.push(currentSpeed);
          if (rollingWindow.length > rollingWindowSize) {
            rollingWindow.shift();
          }
          const rollingAverage = rollingWindow.reduce((sum, speed) => sum + speed, 0) / rollingWindow.length;

          // Use rolling average for the chart
          speedChart.data.datasets[0].data.push(rollingAverage);

          console.log(now, currentSpeed, 'Rolling Average:', rollingAverage);
        } else if (!first && lastTs !== latestTs) {
          const v = data.spotifyAPI.history[data.spotifyAPI.history.length - 1];

          const speed = v.count / 10;

          rollingWindow.push(speed);

          if (rollingWindow.length > rollingWindowSize) {
            rollingWindow.shift();
          }

          const rollingAverage = rollingWindow.reduce((sum, speed) => sum + speed, 0) / rollingWindow.length;

          speedChart.data.labels.push(new Date(v.timestamp));
          speedChart.data.datasets[0].data.push(rollingAverage);
        } else {
          data.spotifyAPI.history.forEach(v => {
            const speed = v.count / 10;
            speedChart.data.labels.push(new Date(v.timestamp));
            speedChart.data.datasets[0].data.push(speed);

            // Initialize rolling average calculation
            rollingWindow.push(speed);
            if (rollingWindow.length > rollingWindowSize) {
              rollingWindow.shift();
            }
          });

          first = false;
        }

        lastTs = latestTs;

        // Keep only the last 60 seconds of data
        // if (speedChart.data.labels.length > 60) {
        //   speedChart.data.labels.shift();
        //   speedChart.data.datasets[0].data.shift();
        // 

        speedChart.update();
      } catch (error) {
        console.error('Error fetching API speed:', error);
      }
    }

    fetchSpeed(); // initial call
    setInterval(fetchSpeed, 1e3);
  </script>
</body>
</html>
