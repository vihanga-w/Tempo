<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tempo API Speed Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    canvas {
      max-width: 800px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Tempo API Request Speed</h1>
  <canvas id="speedChart"></canvas>

  <script>
    const ctx = document.getElementById('speedChart').getContext('2d');
    const speedData = {
      labels: [],
      datasets: [{
        label: 'Requests per Second (spotifyAPI.speed1)',
        data: [],
        fill: false,
        borderColor: 'blue',
        tension: 0.4 // Increased tension for smoother curves
      }]
    };

    const speedChart = new Chart(ctx, {
      type: 'line',
      data: speedData,
      options: {
        scales: {
          x: {
            title: {
              display: true,
              text: 'Time'
            },
            type: 'time',
            time: {
              unit: 'minute',
              tooltipFormat: 'HH:mm:ss',
              displayFormats: {
                minute: 'HH:mm'
              }
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Requests/sec'
            }
          }
        }
      }
    });

    async function fetchSpeed() {
      try {
        const response = await fetch('https://api.tempo-music.co/.stats');
        const data = await response.json();
        const history = data.spotifyAPI.history;

        // Update chart with historical data
        speedChart.data.labels = history.map(entry => new Date(entry.timestamp));
        speedChart.data.datasets[0].data = history.map(entry => entry.count / 10); // Convert to requests/sec
        speedChart.update();
      } catch (error) {
        console.error('Error fetching API speed:', error);
      }
    }

    fetchSpeed(); // initial call
    setInterval(fetchSpeed, 10000); // update every 10 seconds
  </script>
</body>
</html>
