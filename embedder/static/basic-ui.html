<!DOCTYPE html>
<html>
    <head>
        <title>Tempo Realtime Demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #121212; /* Dark background */
                color: #cccccc; /* Slightly dimmer text color */
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .loading {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9999;
                background-color: rgb(18, 18, 18); /* Slightly transparent background */
            }
            .loading h1 {
                color: #cccccc; /* Slightly dimmer text color */
                margin-bottom: 20px;
            }
            .spinner {
                border: 4px solid rgba(255, 255, 255, 0.1); /* Light border */
                border-left-color: #cccccc; /* Slightly dimmer spinner color */
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            #states {
                width: 80%;
                max-width: 600px;
                background-color: #1e1e1e; /* Darker background for states */
                padding: 20px;
                padding-bottom: 0px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); /* Darker shadow */
                display: none;
            }
            .user-state {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid #333; /* Darker border */
            }
            .user-state:last-child {
                border-bottom: none;
            }
            .user-state span {
                font-size: 16px;
                color: #cccccc; /* Slightly dimmer text color */
            }
            .user-state img {
                width: 100px; /* Increased size */
                height: 100px; /* Increased size */
                border-radius: 4px;
                margin-right: 10px;
            }
            .user-state .info {
                flex-grow: 1;
                margin-right: 10px; /* Add margin to prevent overlap */
                position: relative; /* For positioning the paused icon */
            }
            .user-state .info span {
                display: block; /* Ensure each span is on a new line */
            }
            .user-state .playback {
                width: 100%; /* Adjust width */
                height: 5px;
                background-color: #333; /* Darker background */
                border-radius: 2px;
                margin-top: 5px;
                position: relative;
            }
            .user-state .playback .progress {
                height: 100%;
                background-color: #1db954; /* Nicer green progress color */
                border-radius: 2px;
                width: 0;
            }
            .nothing-playing {
                font-style: italic;
                color: #999;
                text-align: center;
                margin-top: 20px;
            }
            .user-state .username {
                font-weight: bold;
                margin-bottom: 5px;
            }
            .user-state .time-info {
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                color: #bbb; /* Lighter text color */
            }
            .explicit-icon {
                display: inline-block;
                width: 16px;
                height: 16px;
                vertical-align: middle;
                margin-left: 5px;
                background-color: #cccccc; /* Light grey background */
                border-radius: 4px; /* Rounded corners */
            }
            .explicit-icon text {
                fill: black; /* Black text color */
            }
            .play-state {
                font-size: 14px;
                color: #cccccc; /* Slightly dimmer text color */
                margin-top: 5px;
            }
            .spotify-callback-link svg {
                width: 28px;
                height: 28px;
                float: left;
            }
            .spotify-callback-link span {
                font-size: 12px;
                float: right;
                margin-left: 5px;
                text-align: left;
            }
            .spotify-callback-link {
                position: absolute;
                top: 2px;
                right: 5px;
                background-color: rgba(18, 18, 18, 0.75);
                box-shadow: rgba(18, 18, 18, 0.75) 0px 0px 10px 6px;
            }
            #listening-count {
                font-size: 26px;
                font-weight: bold;
                margin-bottom: 5px;
                text-align: left;
            }
            @media (max-width: 600px) {
                body {
                    padding: 0px;
                }
                #states {
                    width: 100vw;
                    height: 100vh;
                    background-color: transparent;
                    padding: 0px;
                }
                #listening-count {
                    margin-top: 15px;
                    margin-left: 15px;
                }
                .user-state {
                    margin-bottom: 10px;
                    margin-left: 15px;
                    margin-right: 15px;
                }
                .user-state img {
                    justify-content: center;
                    width: 85px; /* Adjust size for mobile */
                    height: 85px; /* Adjust size for mobile */
                    margin: auto;
                    margin-right: 10px;
                }
                .user-state .info {
                    /* text-align: center; */
                    margin-right: 0;
                }
                .user-state .playback {
                    width: 100%;
                }
                .user-state .time-info {
                    justify-content: space-between;
                }
            }
        </style>
    </head>
    <body>
        <div class="loading" id="loading">
            <!-- <h1>Connecting to Tempo</h1> -->
            <div class="spinner"></div>
        </div>
        <div id="states">
            <div id="listening-count"></div>
        </div>
        <script>
            let baseUrl = "https://tempo.filmclick.eu.org";

            const interpolationHandles = {};
            let listeningCount = 0;
            const listeningUsers = new Set();
            let initialDataLoaded = false;
            let imagesLoaded = 0;
            let totalImages = 0;
            let allowUpdate = false;

            function createSpotifyDeeplinkUrl(trackId) {
                return `https://open.spotify.com/track/${trackId}`;
            }

            function createUserStateElement(userId) {
                const el = document.createElement("div");
                el.className = "user-state";
                el.id = userId + "_c";
                el.innerHTML = `
                    <img id="${userId}_albumArt" src="placeholder.jpg" alt="Album Art">
                    <div class="info">
                        <span id="${userId}_username" class="username">Username</span>
                        <span id="${userId}_songName" style="display: flex;">Loading</span>
                        <span id="${userId}_artistName">Artist</span>
                        <span id="${userId}_playState" class="play-state"></span>
                        <div class="playback" id="${userId}_playback_bar">
                            <div id="${userId}_progress" class="progress"></div>
                        </div>
                        <div class="time-info">
                            <span id="${userId}_currentTime">0:00</span>
                            <span id="${userId}_duration">0:00</span>
                        </div>
                        <div class="spotify-callback-link" id="${userId}_scl">
                            <span>
                                Play on
                                <br>
                                Spotify
                            </span>
                            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0,0,256,256" width="50px" height="50px" fill-rule="nonzero"><g fill="#cccccc" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="none" font-weight="none" font-size="none" text-anchor="none" style="mix-blend-mode: normal"><g transform="scale(5.12,5.12)"><path d="M25.009,1.982c-12.687,0 -23.009,10.322 -23.009,23.009c0,12.687 10.322,23.009 23.009,23.009c12.687,0 23.009,-10.321 23.009,-23.009c0,-12.688 -10.322,-23.009 -23.009,-23.009zM34.748,35.333c-0.289,0.434 -0.765,0.668 -1.25,0.668c-0.286,0 -0.575,-0.081 -0.831,-0.252c-2.473,-1.649 -6.667,-2.749 -10.167,-2.748c-3.714,0.002 -6.498,0.914 -6.526,0.923c-0.784,0.266 -1.635,-0.162 -1.897,-0.948c-0.262,-0.786 0.163,-1.636 0.949,-1.897c0.132,-0.044 3.279,-1.075 7.474,-1.077c3.5,-0.002 8.368,0.942 11.832,3.251c0.69,0.46 0.876,1.391 0.416,2.08zM37.74,29.193c-0.325,0.522 -0.886,0.809 -1.459,0.809c-0.31,0 -0.624,-0.083 -0.906,-0.26c-4.484,-2.794 -9.092,-3.385 -13.062,-3.35c-4.482,0.04 -8.066,0.895 -8.127,0.913c-0.907,0.258 -1.861,-0.272 -2.12,-1.183c-0.259,-0.913 0.272,-1.862 1.184,-2.12c0.277,-0.079 3.854,-0.959 8.751,-1c4.465,-0.037 10.029,0.61 15.191,3.826c0.803,0.5 1.05,1.56 0.548,2.365zM40.725,22.013c-0.373,0.634 -1.041,0.987 -1.727,0.987c-0.344,0 -0.692,-0.089 -1.011,-0.275c-5.226,-3.068 -11.58,-3.719 -15.99,-3.725c-0.021,0 -0.042,0 -0.063,0c-5.333,0 -9.44,0.938 -9.481,0.948c-1.078,0.247 -2.151,-0.419 -2.401,-1.495c-0.25,-1.075 0.417,-2.149 1.492,-2.4c0.185,-0.043 4.573,-1.053 10.39,-1.053c0.023,0 0.046,0 0.069,0c4.905,0.007 12.011,0.753 18.01,4.275c0.952,0.56 1.271,1.786 0.712,2.738z"></path></g></g></svg>
                        </div>
                    </div>
                    <div id="${userId}_nothingPlaying" class="nothing-playing" style="display: none;">Nothing is playing</div>
                `;

                document.getElementById("states").appendChild(el);
            }

            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function updateUserState(userId, username, songId, songName, artists, albumArt, isPlaying, progressNormal, timeRemainingMs, explicit, sock) {
                const usernameEl = document.getElementById(`${userId}_username`);
                const songNameEl = document.getElementById(`${userId}_songName`);
                const artistNameEl = document.getElementById(`${userId}_artistName`);
                const albumArtEl = document.getElementById(`${userId}_albumArt`);
                const progressEl = document.getElementById(`${userId}_progress`);
                const playbackBar = document.getElementById(`${userId}_playback_bar`)
                const currentTimeEl = document.getElementById(`${userId}_currentTime`);
                const durationEl = document.getElementById(`${userId}_duration`);
                const playStateEl = document.getElementById(`${userId}_playState`);
                const nothingPlayingEl = document.getElementById(`${userId}_nothingPlaying`);
                const spotifyCb = document.getElementById(`${userId}_scl`);

                usernameEl.innerText = username;
                songNameEl.innerHTML = songName + (explicit ? `
                    <svg width="16px" style="margin-left: 4px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="explicit">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 6h-3v2h3c.55 0 1 .45 1 1s-.45 1-1 1h-3v2h3c.55 0 1 .45 1 1s-.45 1-1 1h-4c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h4c.55 0 1 .45 1 1s-.45 1-1 1z" fill="#cccccc" class="color000000 svgShape"></path>
                    </svg>
                ` : '');
                artistNameEl.innerText = (artists ?? []).map(artist => artist.name).join(", ");
                albumArtEl.onload = () => {
                    imagesLoaded++;
                    checkIfLoadingComplete();
                };
                albumArtEl.onerror = () => {
                    imagesLoaded++;
                    checkIfLoadingComplete();
                };
                albumArtEl.src = albumArt;
                totalImages++;
                spotifyCb.onclick = () => {
                    if (songId == "Nothing is playing")
                        return;

                    const nwin = window.open(createSpotifyDeeplinkUrl(songId), undefined);

                    setTimeout(() => {
                        try {
                            nwin.close();
                        } catch { }
                    }, 1500);
                }

                // Show or hide elements based on whether something is playing
                const isNothingPlaying = !songName || songName === "Nothing is playing";
                artistNameEl.style.display = isNothingPlaying ? "none" : "block";
                albumArtEl.style.display = isNothingPlaying ? "none" : "block";
                playStateEl.style.display = isNothingPlaying ? "none" : "block";
                nothingPlayingEl.style.display = isNothingPlaying ? "block" : "none";

                const timeRemaining = timeRemainingMs / 1000; // Convert to seconds
                const duration = timeRemaining / (1 - progressNormal);
                let currentTime = duration * progressNormal;

                if (isNaN(duration) || isNaN(currentTime)) {
                    currentTimeEl.style.display = "none";
                    durationEl.style.display = "none";
                    playbackBar.style.display = "none";
                    playStateEl.innerText = "";
                } else {
                    currentTimeEl.style.display = "block";
                    durationEl.style.display = "block";
                    playbackBar.style.display = isNothingPlaying ? "none" : "block";
                    currentTimeEl.innerText = formatTime(currentTime);
                    durationEl.innerText = formatTime(duration);
                    playStateEl.innerText = isPlaying ? "Playing" : "Paused";
                }

                if (isNothingPlaying) {
                    songNameEl.classList.add("nothing-playing");
                    document.getElementById(userId + "_c").style.display = "none";
                    listeningUsers.delete(userId);
                } else {
                    songNameEl.classList.remove("nothing-playing");
                    document.getElementById(userId + "_c").style.display = "flex";
                    listeningUsers.add(userId);
                }

                // Update listening count
                listeningCount = listeningUsers.size;
                document.getElementById("listening-count").innerText = `${listeningCount} listening`;

                // Render initial progress
                const initialProgress = (currentTime / duration) * 100;
                progressEl.style.width = initialProgress + "%";

                // Stop previous interpolation if exists
                if (interpolationHandles[userId]) {
                    cancelAnimationFrame(interpolationHandles[userId].anim);
                }

                // Interpolate time passing
                let lastUpdateTime = Date.now();
                function interpolate() {
                    if (isPlaying) {
                        const now = Date.now();
                        const elapsed = (now - lastUpdateTime) / 1000; // Convert to seconds
                        currentTime += elapsed;
                        const newProgress = currentTime / duration;

                        currentTimeEl.innerText = formatTime(currentTime > duration ? duration : currentTime);
                        progressEl.style.width = (newProgress * 100) + "%";

                        if (currentTime < duration) {
                            lastUpdateTime = now;
                            interpolationHandles[userId] = {
                                anim: requestAnimationFrame(interpolate),
                                sock,
                            };
                        }
                    } else {
                        if (interpolationHandles[userId])
                            cancelAnimationFrame(interpolationHandles[userId].anim);
                        
                        currentTimeEl.innerText = formatTime(currentTime);
                        progressEl.style.width = (progressNormal * 100) + "%";
                    }
                }
                interpolate();
            }

            function checkIfLoadingComplete() {
                if (initialDataLoaded && imagesLoaded === totalImages) {
                    document.getElementById("loading").style.display = "none";
                }
            }

            async function getPlayingUsers() {
                const req = await fetch(baseUrl + "/spotify/public/sessions");
                let res = await req.json();

                res = res.sort();

                return res;
            }

            async function main() {
                await new Promise(resolve => setTimeout(resolve, 250));

                let initRes = await getPlayingUsers();

                // Periodically refresh active users list
                setInterval(async () => {
                    const res = await getPlayingUsers();

                    if (res.length !== initRes.length) {
                        const users = Object.keys(interpolationHandles);

                        allowUpdate = true;

                        for (u of users) {
                            try { cancelAnimationFrame(interpolationHandles[u].anim); } catch { }
                            try { interpolationHandles[u].sock.close(); } catch { }
                        }

                        // TODO: Dont remove all, just the ones that have changed
                        document.getElementById("states").innerHTML = `<div id="listening-count"></div>`;

                        allowUpdate = false;
                        initRes = res;

                        main();
                    }
                }, 10e3);

                document.getElementById("states").style.display = "block";

                for (const uid of initRes) {
                    createUserStateElement(uid);

                    // Setup the WebSocket connection
                    const sock = new WebSocket(baseUrl.replace("https", "wss") + "/stream/" + uid);

                    sock.onmessage = (d) => {
                        const data = JSON.parse(d.data);

                        if (data.code == 200) {
                            const state = data.data.state;

                            if (data.data.action == "LOAD" && !state) {
                                updateUserState(uid, "Unknown", "Nothing is playing", "Nothing is playing", [], "", false, 0, 0, false, sock);
                            } else if (data.data.action == "STOPPED") {
                                document.getElementById(`${uid}_c`).remove();
                                try { sock.close(); } catch { }
                            } else if (state) {
                                updateUserState(uid, state.username, state.songId, state.name, state.artists, state.imageUrl, state.isPlaying, state.progressNormal, state.timeRemaining, state.explicit, sock);
                            }
                        }

                        // Check if all initial data has been loaded
                        if (!initialDataLoaded && initRes.every(uid => document.getElementById(uid + "_c"))) {
                            initialDataLoaded = true;
                            checkIfLoadingComplete();
                        }
                    };

                    sock.onclose = () => {
                        if (!allowUpdate)
                            return;

                        document.getElementById("loading").style.display = "flex";
                        document.getElementById("states").style.display = "none";
                        setTimeout(() => {
                            location.reload();
                        }, 1000);
                    };
                }
            }

            window.onload = () => {
                main();
            }
        </script>
    </body>
</html>
