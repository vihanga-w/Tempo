<!DOCTYPE html>
<html>
    <head>
        <title>Tempo Realtime Demo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .loading {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .loading h1 {
                color: #333;
                margin-bottom: 20px;
            }
            .spinner {
                border: 4px solid rgba(0, 0, 0, 0.1);
                border-left-color: #333;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            #states {
                width: 80%;
                max-width: 600px;
                background-color: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                display: none;
            }
            .user-state {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid #ddd;
            }
            .user-state:last-child {
                border-bottom: none;
            }
            .user-state span {
                font-size: 16px;
                color: #555;
            }
            .user-state img {
                width: 50px;
                height: 50px;
                border-radius: 4px;
                margin-right: 10px;
            }
            .user-state .info {
                flex-grow: 1;
            }
            .user-state .info span {
                display: block;
            }
            .user-state .playback {
                width: 100%;
                height: 5px;
                background-color: #ddd;
                border-radius: 2px;
                margin-top: 5px;
                position: relative;
            }
            .user-state .playback .progress {
                height: 100%;
                background-color: #333;
                border-radius: 2px;
                width: 0;
            }
        </style>
    </head>
    <body>
        <div class="loading" id="loading">
            <h1>Connecting to Tempo</h1>
            <div class="spinner"></div>
        </div>
        <div id="states"></div>
        <script>
            let baseUrl = "https://tempo.filmclick.eu.org";

            function createUserStateElement(userId) {
                const el = document.createElement("div");
                el.className = "user-state";
                el.id = userId + "_c";
                el.innerHTML = `
                    <img id="${userId}_albumArt" src="placeholder.jpg" alt="Album Art">
                    <div class="info">
                        <span id="${userId}_songName">Loading</span>
                        <span id="${userId}_artistName">Artist</span>
                        <div class="playback">
                            <div id="${userId}_progress" class="progress"></div>
                        </div>
                    </div>
                    <span id="${userId}_playState"></span>
                `;

                document.getElementById("states").appendChild(el);
            }

            function updateUserState(userId, songId, artistName, albumArt, isPlaying, progress) {
                document.getElementById(`${userId}_songName`).innerText = songId;
                document.getElementById(`${userId}_artistName`).innerText = artistName;
                document.getElementById(`${userId}_albumArt`).src = albumArt;
                document.getElementById(`${userId}_playState`).innerText = (isPlaying == true ? "Playing" : isPlaying == false ? "Paused" : "");
                document.getElementById(`${userId}_progress`).style.width = progress + "%";

                // Hide artist name and progress slider if nothing is playing
                document.getElementById(`${userId}_artistName`).style.display = songId === "Nothing is playing" ? "none" : "block";
                document.getElementById(`${userId}_progress`).parentElement.style.display = songId === "Nothing is playing" ? "none" : "block";
            }

            async function main() {
                await new Promise(resolve => setTimeout(resolve, 250));

                const req = await fetch(baseUrl + "/spotify/public/sessions");
                const res = await req.json();

                document.getElementById("loading").style.display = "none";
                document.getElementById("states").style.display = "block";

                for (const uid of res) {
                    createUserStateElement(uid);

                    // Setup the WebSocket connection
                    const sock = new WebSocket(baseUrl.replace("https", "wss") + "/stream/" + uid);

                    sock.onmessage = (d) => {
                        const data = JSON.parse(d.data);

                        console.log(uid, data);

                        if (data.code == 200) {
                            const state = data.data.state;

                            if (data.data.action == "LOAD" && !state)
                                updateUserState(uid, "Nothing is playing", "Unknown Artist", "placeholder.jpg", null, 0);
                            else
                                updateUserState(uid, state.songId, state.artistName, state.albumArt, state.isPlaying, state.progress);
                        }
                    }
                }
            }

            window.onload = () => {
                main();
            }
        </script>
    </body>
</html>
