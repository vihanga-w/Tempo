<!DOCTYPE html>
<html>
    <head>
        <title>Tempo Realtime Demo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .loading {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .loading h1 {
                color: #333;
                margin-bottom: 20px;
            }
            .spinner {
                border: 4px solid rgba(0, 0, 0, 0.1);
                border-left-color: #333;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            #states {
                width: 80%;
                max-width: 600px;
                background-color: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                display: none;
            }
            .user-state {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid #ddd;
            }
            .user-state:last-child {
                border-bottom: none;
            }
            .user-state span {
                font-size: 16px;
                color: #555;
            }
            .user-state img {
                width: 70px; /* Increased size */
                height: 70px; /* Increased size */
                border-radius: 4px;
                margin-right: 10px;
            }
            .user-state .info {
                flex-grow: 1;
                margin-right: 10px; /* Add margin to prevent overlap */
                position: relative; /* For positioning the paused icon */
            }
            .user-state .playback {
                width: calc(100% - 30px); /* Adjust width to accommodate paused icon */
                height: 5px;
                background-color: #ddd;
                border-radius: 2px;
                margin-top: 5px;
                position: relative;
            }
            .user-state .playback .progress {
                height: 100%;
                background-color: #333;
                border-radius: 2px;
                width: 0;
            }
            .nothing-playing {
                font-style: italic;
                color: #999;
            }
            .user-state .username {
                font-weight: bold;
                margin-bottom: 5px;
            }
            .user-state .time-info {
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                color: #777;
            }
            .user-state .paused-icon {
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                display: none;
                color: black; /* Make the icon black */
            }
            .user-state .paused-icon.show {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="loading" id="loading">
            <h1>Connecting to Tempo</h1>
            <div class="spinner"></div>
        </div>
        <div id="states"></div>
        <script>
            let baseUrl = "https://tempo.filmclick.eu.org";

            function createUserStateElement(userId) {
                const el = document.createElement("div");
                el.className = "user-state";
                el.id = userId + "_c";
                el.innerHTML = `
                    <img id="${userId}_albumArt" src="placeholder.jpg" alt="Album Art">
                    <div class="info">
                        <span id="${userId}_username" class="username">Username</span>
                        <span id="${userId}_songName">Loading</span>
                        <span id="${userId}_artistName">Artist</span>
                        <div class="playback">
                            <div id="${userId}_progress" class="progress"></div>
                        </div>
                        <div class="time-info">
                            <span id="${userId}_currentTime">0:00</span>
                            <span id="${userId}_duration">0:00</span>
                        </div>
                        <span id="${userId}_playState" class="paused-icon">⏸️</span>
                    </div>
                `;

                document.getElementById("states").appendChild(el);
            }

            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function updateUserState(userId, username, songId, artistName, albumArt, isPlaying, progressNormal, timeRemainingMs) {
                const usernameEl = document.getElementById(`${userId}_username`);
                const songNameEl = document.getElementById(`${userId}_songName`);
                const artistNameEl = document.getElementById(`${userId}_artistName`);
                const albumArtEl = document.getElementById(`${userId}_albumArt`);
                const playStateEl = document.getElementById(`${userId}_playState`);
                const progressEl = document.getElementById(`${userId}_progress`);
                const currentTimeEl = document.getElementById(`${userId}_currentTime`);
                const durationEl = document.getElementById(`${userId}_duration`);

                usernameEl.innerText = username;
                songNameEl.innerText = songId;
                artistNameEl.innerText = artistName;
                albumArtEl.src = albumArt;
                progressEl.style.width = (progressNormal * 100) + "%";

                const timeRemaining = timeRemainingMs / 1000; // Convert to seconds
                const duration = timeRemaining / (1 - progressNormal);
                const currentTime = duration * progressNormal;

                console.log(songId, currentTime, duration)

                currentTimeEl.innerText = formatTime(currentTime);
                durationEl.innerText = formatTime(duration);

                // Hide artist name, album art, and progress slider if nothing is playing
                artistNameEl.style.display = songId === "Nothing is playing" ? "none" : "block";
                albumArtEl.style.display = songId === "Nothing is playing" ? "none" : "block";
                progressEl.parentElement.style.display = songId === "Nothing is playing" ? "none" : "block";

                // Show special message for "Nothing is playing"
                if (songId === "Nothing is playing") {
                    songNameEl.classList.add("nothing-playing");
                    albumArtEl.src = "special-placeholder.jpg"; // Special placeholder image
                } else {
                    songNameEl.classList.remove("nothing-playing");
                }

                // Show paused icon if paused
                playStateEl.classList.toggle("show", isPlaying === false);
            }

            async function main() {
                await new Promise(resolve => setTimeout(resolve, 250));

                const req = await fetch(baseUrl + "/spotify/public/sessions");
                const res = await req.json();

                document.getElementById("loading").style.display = "none";
                document.getElementById("states").style.display = "block";

                for (const uid of res) {
                    createUserStateElement(uid);

                    // Setup the WebSocket connection
                    const sock = new WebSocket(baseUrl.replace("https", "wss") + "/stream/" + uid);

                    sock.onmessage = (d) => {
                        const data = JSON.parse(d.data);

                        console.log(uid, data);

                        if (data.code == 200) {
                            const state = data.data.state;

                            if (data.data.action == "LOAD" && !state)
                                updateUserState(uid, state.username, "Nothing is playing", "Unknown Artist", "placeholder.jpg", null, 0, 0);
                            else
                                updateUserState(uid, state.username, state.songId, state.artistName, state.imageUrl, state.isPlaying, state.progressNormal, state.timeRemaining);
                        }
                    }
                }
            }

            window.onload = () => {
                main();
            }
        </script>
    </body>
</html>
